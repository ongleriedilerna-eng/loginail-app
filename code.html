<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Votre code · Loginail</title>
<link rel="icon" href="loginail-app2/favicon.svg">
<link rel="stylesheet" href="loginail-app2/polices.css?v=1711sc">
<!-- 17/11 (Marie) : le bouton « Copier le code » de l'e-mail de connexion arrive ici.
     Le code est après le # de l'adresse : il ne part jamais vers un serveur, et il ne vit que quelques minutes. -->
<style>
:root{--noir:#1E1C1B;--gris:#6B625C;--fond:#F6F3EF;--rose:#F3E3E1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--fond);color:var(--noir);font-family:Jost,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 60% at 90% 0%,#F3DADA 0%,transparent 60%),var(--fond);min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:max(80px,env(safe-area-inset-top)) 22px 40px}
.marque{font-size:11px;letter-spacing:.42em;font-weight:500}
h1{font-weight:300;font-size:34px;margin:18px 0 8px}
p{font-size:14px;color:var(--gris);line-height:1.5;margin:0 0 18px}
.code{background:#fff;border-radius:22px;padding:22px 16px;text-align:center;font-weight:300;font-size:44px;letter-spacing:.12em;font-variant-numeric:tabular-nums;margin:6px 0 14px;user-select:all;-webkit-user-select:all}
button{width:100%;height:56px;border:0;border-radius:18px;background:var(--noir);color:#fff;font:inherit;font-size:16px;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.97)}
button.fait{background:var(--rose);color:var(--noir)}
.ok{font-size:14px;line-height:1.5;margin-top:14px;text-align:center;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.ok.on{opacity:1;transform:none}
.rien .code,.rien button,.rien .ok{display:none}
</style>
</head>
<body>
<main id="m">
  <div class="marque">LOGINAIL</div>
  <h1>Votre code.</h1>
  <p id="t">Touchez « Copier le code », puis revenez dans l’appli Loginail et touchez « Coller le code ».</p>
  <div class="code" id="c"></div>
  <button id="b" type="button">Copier le code</button>
  <div class="ok" id="ok">Copié ✓ Revenez dans l’appli Loginail.</div>
</main>
<script>
(function () {
  var code = (location.hash.match(/\d{6,8}/) || [""])[0], m = document.getElementById("m");
  try { history.replaceState(null, "", location.pathname); } catch (e) {}   /* on enlève le code de l'adresse */
  if (!code) { m.className = "rien"; document.getElementById("t").textContent = "Ce lien ne contient pas de code. Ouvrez le dernier e-mail Loginail et touchez à nouveau « Copier le code »."; return; }
  document.getElementById("c").textContent = code.length === 6 ? code.slice(0, 3) + " " + code.slice(3) : code;
  var b = document.getElementById("b"), ok = document.getElementById("ok");
  function vieux() { var t = document.createElement("textarea"); t.value = code; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); t.setSelectionRange(0, 99); var r = false; try { r = document.execCommand("copy"); } catch (e) {} t.remove(); return r; }
  function fini() { b.textContent = "Code copié ✓"; b.className = "fait"; ok.className = "ok on"; }
  b.addEventListener("click", function () {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(fini, function () { if (vieux()) fini(); });
    else if (vieux()) fini();
  });
})();
</script>
</body>
</html>
