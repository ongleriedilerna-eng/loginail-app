<script>/* 13/11 (Apple) : sur un écran tactile (iPhone, iPad) ou dans l'appli emballée, l'appli prend tout l'écran — le faux téléphone ne sert que sur ordinateur */if(matchMedia("(hover:none) and (pointer:coarse)").matches||!/^https?:$/.test(location.protocol)||/[?&]plein/.test(location.search))document.documentElement.classList.add("plein");</script>
<title>Loginail · Espace pro</title>
<meta name="theme-color" content="#F6F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loginail">

<style>
/* la vraie appli : un téléphone sur l'ordinateur, plein écran sur téléphone */
.rangee{padding:20px 16px}
@media (max-width:699px){.rangee{padding:0}.tel{height:100dvh!important}}
/* 13/11 (Apple) : plein écran sur iPhone et iPad ; sur iPad le contenu reste centré, à la largeur d'un téléphone */
html.plein body{background:var(--creme)}html.plein .bandeau,html.plein .reglages,html.plein .code,html.plein .ile{display:none!important}
html.plein .rangee{padding:0!important;display:block}html.plein .col{display:block}
html.plein .tel{zoom:1!important;width:100vw!important;height:100dvh!important;padding:0!important;border-radius:0!important;box-shadow:none!important;background:none!important}
html.plein .ecran{width:100%!important;height:100%!important;border-radius:0!important}
@media (min-width:700px){html.plein .vue{padding-left:calc((100% - 560px)/2)!important;padding-right:calc((100% - 560px)/2)!important}
  html.plein .ong.o1{left:calc((100% - 560px)/2);right:calc((100% - 560px)/2)}html.plein .feuille{left:calc((100% - 600px)/2);right:calc((100% - 600px)/2)}}
/* 13/11 (Marie) : iPad couché — tout en plus grand (l'appli est agrandie de 30 %) */
/* 13/11 (Marie) : iPad debout, tout en plus grand */
@media (min-width:700px) and (max-width:899px) and (orientation:portrait){html.plein .tel{zoom:1.2!important;width:calc(100vw / 1.2)!important;height:calc(100dvh / 1.2)!important}}
@media (min-width:900px) and (orientation:portrait){html.plein .tel{zoom:1.45!important;width:calc(100vw / 1.45)!important;height:calc(100dvh / 1.45)!important}}
@media (min-width:1000px) and (orientation:landscape){html.plein .tel{zoom:1.3!important;width:calc(100vw / 1.3)!important;height:calc(100dvh / 1.3)!important}
  /* 13/11 (Marie) : couché, l'appli remplit tout l'écran (plus de grandes marges sur les côtés) */
  html.plein .vue{padding-left:34px!important;padding-right:34px!important}
  html.plein .ong.o1{left:calc(50% - 300px)!important;right:calc(50% - 300px)!important}
  html.plein .feuille{left:calc(50% - 340px)!important;right:calc(50% - 340px)!important}}
/* l'encoche et la barre du bas de l'iPhone */
html.plein .vue{padding-top:max(62px,calc(env(safe-area-inset-top) + 40px))}
html.plein .ong.o1{bottom:calc(14px + env(safe-area-inset-bottom))}
html.plein .toast{top:calc(60px + env(safe-area-inset-top))}
html.plein .feuille{max-height:calc(100% - env(safe-area-inset-top) - 30px)}
/* une appli, pas un site : pas de zoom automatique sur les champs, pas de surlignage au toucher, pas d'élastique */
.ecran input:not(#cx-code),.ecran textarea,.ecran select,.champ{font-size:16px!important}
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
html.plein .ecran{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html.plein .ecran input,html.plein .ecran textarea{-webkit-user-select:text;user-select:text}
.pap .pr.ligne-en{box-shadow:inset 3px 0 0 #2E7D5B}
.en-ligne{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:#E3F1EA;color:#2E7D5B;font-size:9.5px;font-style:normal;vertical-align:1px}
.nav-sem{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;font-size:12.5px;color:var(--gris)}
.nav-sem button{width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer}
.pr.barre{opacity:.45;text-decoration:line-through}
.cx{padding-top:90px}.cx h1{font-weight:300;font-size:34px;margin:18px 0 8px}.cx p{font-size:14px;color:var(--gris);line-height:1.5;margin:0 0 18px}
.cx .marque{font-size:11px;letter-spacing:.42em;font-weight:500}
.cx input{width:100%;height:50px;border-radius:14px;border:1px solid rgba(30,28,27,.12);background:#fff;padding:0 16px;font:inherit;font-size:16px;margin-bottom:10px}
.cx .btn{width:100%}.cx .ok{background:#fff;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.5;margin-bottom:14px}
.lien-t{display:block;margin:14px auto 0;border:0;background:none;font-size:13px;color:var(--gris);text-decoration:underline;cursor:pointer}
.champ{width:100%;height:46px;border-radius:14px;border:1px solid rgba(30,28,27,.12);background:#fff;padding:0 14px;font:inherit;font-size:15px;margin-bottom:8px}
.lab2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin:12px 0 6px}
.ecran>.charge{position:absolute;inset:0;height:auto;margin:0;background:none;border-radius:0;overflow:visible;display:grid;place-items:center;font-size:0;color:transparent}
/* 12/11 (Marie) : l'ouverture de l'appli — le logo qui arrive, « Loginail » qui s'écrit, une petite étoile. Très court (1,5 s), puis ça s'efface. */
.ouv{position:absolute;inset:0;z-index:999;border-radius:inherit;background:#F6F3EF;display:grid;place-items:center;transition:opacity .35s ease,visibility 0s linear .35s}
.ouv.fin{opacity:0;visibility:hidden;pointer-events:none}
.ouv>div{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:-6%}
.ouv .lg{position:relative;width:84px;height:84px;animation:ouvLogo .55s cubic-bezier(.3,1.6,.5,1) both}
.ouv .lg svg{display:block;width:100%;height:100%}
.ouv .lg .ongle{animation:ouvOngle .5s cubic-bezier(.3,1.4,.5,1) .3s both;transform-box:fill-box;transform-origin:center}
.ouv .et{position:absolute;right:-12px;top:-12px;font-size:20px;line-height:1;color:#1E1C1B;animation:ouvEt .9s ease .55s both}
.ouv .mot{display:flex;font:400 19px/1 Jost,Helvetica,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#1E1C1B;padding-left:.34em}
.ouv .mot span{opacity:0;animation:ouvL .32s ease forwards}
@keyframes ouvLogo{from{opacity:0;transform:scale(.55) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes ouvOngle{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes ouvEt{0%{opacity:0;transform:scale(.2) rotate(-40deg)}45%{opacity:1;transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:scale(1)}}
@keyframes ouvL{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes ouvFin{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.ouv,.ouv *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="rangee"><div class="tel"><div class="ecran" id="E"><div class="charge">LOGINAIL</div></div><div class="ouv" id="ouv" aria-hidden="true"><div><div class="lg"><svg viewBox="0 0 200 200"><rect width="200" height="200" rx="44" fill="#1E1C1B"/><g transform="translate(26 70) scale(.52)"><rect x="0" y="5" width="225" height="120" rx="60" fill="#F3EEE8"/><g class="ongle"><path d="M172 21H215C254 21 282 42 282 65C282 88 254 109 215 109H172A44 44 0 0 1 172 21Z" fill="#F3EEE8"/><path d="M172 28H213C247 28 274 47 274 65C274 83 247 102 213 102H172A37 37 0 0 1 172 28Z" fill="#1E1C1B"/></g></g></svg><span class="et">✦</span></div><div class="mot"><span style="animation-delay:0.42s">L</span><span style="animation-delay:0.49s">o</span><span style="animation-delay:0.56s">g</span><span style="animation-delay:0.63s">i</span><span style="animation-delay:0.70s">n</span><span style="animation-delay:0.77s">a</span><span style="animation-delay:0.84s">i</span><span style="animation-delay:0.91s">l</span></div></div></div></div></div>
<script>/* l'ouverture reste tant que l'appli charge (1,5 s au moins), puis s'efface */(function(){var o=document.getElementById("ouv"),E=document.getElementById("E"),t0=Date.now(),t;function vu(){var c=E.querySelector(":scope>.charge");clearTimeout(t);if(c)o.classList.remove("fin");else t=setTimeout(function(){o.classList.add("fin")},Math.max(0,1500-(Date.now()-t0)))}new MutationObserver(vu).observe(E,{childList:true});vu()})()</script>
<script>{const zc=()=>document.documentElement.style.setProperty("--z",Math.min(1,(innerHeight-40)/866,(innerWidth-30)/412).toFixed(3));zc();addEventListener("resize",zc)}</script>
